
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check real-time weather conditions for any city with WeatherNow.">
    <title>WeatherNow | Live Weather Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="dashboard">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">☀</span>
                <h1>WeatherNow<span>.</span></h1>
            </div>
            <p>Live weather updates for your city</p>
        </header>

        <section class="search-section">
            <form id="search-form">
                <label for="city-input">Search for a city</label>

                <div class="search-box">
                    <input
                        type="text"
                        id="city-input"
                        placeholder="Enter city name..."
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="search-btn">
                        Search
                    </button>
                </div>
            </form>
        </section>

        <p id="status-message" class="status-message" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section id="weather-container" class="weather-container" hidden>

            <div class="weather-main">
                <div>
                    <p class="location-label">CURRENT WEATHER</p>
                    <h2 id="city-name">City Name</h2>
                    <p id="weather-date" class="weather-date"></p>
                </div>

                <div class="temperature-section">
                    <span id="weather-icon" class="weather-icon">☀️</span>
                    <div>
                        <p id="temperature">--°C</p>
                        <p id="weather-description">Weather condition</p>
                    </div>
                </div>
            </div>

            <div class="weather-details">
                <article class="weather-card">
                    <span class="detail-icon">💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </article>

                <article class="weather-card">
                    <span class="detail-icon">💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind-speed">-- km/h</h3>
                </article>

                <article class="weather-card">
                    <span class="detail-icon">🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feels-like">--°C</h3>
                </article>
            </div>

        </section>

        <footer>
            <p>WeatherNow · Powered by Open-Meteo API</p>
        </footer>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
